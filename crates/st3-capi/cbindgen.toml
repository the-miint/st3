# cbindgen configuration for the SourceTracker3 C ABI header (st3.h).
# The header is generated into OUT_DIR by build.rs; it is not committed.

language = "C"
include_guard = "ST3_H"
autogen_warning = "/* Generated by cbindgen from st3-capi. Do not edit by hand. */"
documentation = true
documentation_style = "c99"
cpp_compat = true

# Do not parse the arrow dependency; its C Data Interface types are referenced by
# pointer only and are provided by the standard Arrow abi.h (see [export.rename]).
[parse]
parse_deps = false

[export]
# Emit the config/enum types even though some are referenced only by value.
include = ["St3Status", "St3Collapse", "St3EstimatorKind", "St3Config"]

[export.rename]
# Present the arrow-rs FFI mirrors under their standard C Data Interface names, so
# a consumer that includes the Arrow `abi.h` sees matching (forward-declared)
# types.
"FFI_ArrowArray" = "ArrowArray"
"FFI_ArrowSchema" = "ArrowSchema"
"FFI_ArrowArrayStream" = "ArrowArrayStream"

[enum]
# `St3Status::Ok` -> `ST3_STATUS_OK`, `St3Collapse::Mean` -> `ST3_COLLAPSE_MEAN`,
# `St3EstimatorKind::GibbsCollapsed` -> `ST3_ESTIMATOR_KIND_GIBBS_COLLAPSED`.
rename_variants = "QualifiedScreamingSnakeCase"

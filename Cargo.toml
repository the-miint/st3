[workspace]
resolver = "3"
members = [
    "crates/st3-core",
    "crates/st3-arrow",
    "crates/st3-capi",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["The SourceTracker3 Development Team"]
repository = "https://github.com/the-miint/st3"

[workspace.dependencies]
# Shared pins.
criterion = "0.8"
# JSON parsing for the opt-in wall-clock perf guard (M11). It reads criterion's
# `target/criterion/**/estimates.json` and compares each bench's mean against the
# committed `perf/baseline.json`. Dev-dependency only — never in a shipped crate.
serde_json = "1"
# Arrow data boundary. Only safe array/schema/RecordBatch construction is used in
# st3-arrow, which needs no feature, so default features are off. The C Data
# Interface features (`ffi`/`ffi_stream`) are enabled by st3-capi (M10), which
# does the raw FFI marshaling over these same safe conversions.
arrow = { version = "59", default-features = false }
# C header generation (M10, st3-capi build-dependency). cbindgen reads the crate's
# `#[repr(C)]` types and `extern "C"` fns to emit `st3.h`.
cbindgen = "0.29"
# Per-sink / per-fold parallelism (M8). A per-call scoped ThreadPool sized by
# `jobs` keeps the library reentrant; output is seeded per work-item, so it stays
# byte-identical across thread counts.
rayon = "1.12"
# Rarefaction RNG (M3). rand, rand_xoshiro, rand_distr, and rand_core all resolve
# to rand_core 0.10.x. WeightedIndex lives in rand::distr::weighted (alloc). The
# eval module (M7) additionally samples the Dirichlet distribution, which lives in
# rand_distr (its alloc surface). We always seed explicitly, so default features
# (getrandom/thread_rng) are off across the family.
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_xoshiro = "0.8"
rand_distr = { version = "0.6", default-features = false, features = ["alloc"] }
st3-core = { path = "crates/st3-core" }
st3-arrow = { path = "crates/st3-arrow" }
